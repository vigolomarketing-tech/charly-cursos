<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus | Charly Cursos</title>

  <style>
    :root{
      --bg:#070a0f;
      --panel:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.64);
      --accent:#60d6ff;
      --accent2:#5a6bff;
      --shadow:0 16px 60px rgba(0,0,0,.45);
      --container:1120px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 0%, rgba(96,214,255,.14), transparent 55%),
        radial-gradient(900px 600px at 85% 10%, rgba(90,107,255,.14), transparent 55%),
        radial-gradient(900px 800px at 60% 100%, rgba(96,214,255,.10), transparent 60%),
        var(--bg);
    }

    a{color:inherit;text-decoration:none}
    .container{width:min(var(--container),92%);margin:0 auto}

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(7,10,15,.7);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .topbar__inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:180px;
    }

    .brand__mark{
      width:40px;
      height:40px;
      border-radius:12px;
      display:grid;
      place-items:center;
      font-weight:900;
      background:linear-gradient(135deg, rgba(96,214,255,.22), rgba(90,107,255,.18));
      border:1px solid rgba(255,255,255,.10);
    }

    .brand__text strong{
      display:block;
      line-height:1;
      letter-spacing:.8px;
    }

    .brand__text small{
      display:block;
      color:rgba(255,255,255,.55);
      letter-spacing:3px;
      font-size:10px;
      margin-top:4px;
    }

    .topbar__actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      padding:12px 16px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-weight:700;
      letter-spacing:.2px;
      cursor:pointer;
    }

    .btn--primary{
      border-color:rgba(96,214,255,.25);
      background:linear-gradient(135deg, rgba(96,214,255,.22), rgba(90,107,255,.18));
    }

    .btn--ghost{
      background:transparent;
    }

    .hero{
      padding:34px 0 18px;
    }

    .hero__grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:24px;
      align-items:start;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.72);
      margin:0 0 14px;
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(30px,4vw,48px);
      line-height:1.05;
      letter-spacing:-0.8px;
    }

    .accent{
      background:linear-gradient(90deg, var(--accent), rgba(90,107,255,.9));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .subtitle{
      margin:0 0 18px;
      color:rgba(255,255,255,.72);
      font-size:16px;
      line-height:1.6;
      max-width:60ch;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      margin-top:18px;
    }

    .stat{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:14px;
    }

    .stat strong{
      display:block;
      font-size:22px;
      margin-bottom:4px;
    }

    .stat span{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    .panel{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .panel h2{
      margin:0 0 8px;
      font-size:24px;
    }

    .panel p{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.6;
    }

    .progress{
      margin:14px 0 18px;
    }

    .progress__top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      font-size:14px;
      color:rgba(255,255,255,.78);
    }

    .progress__bar{
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.06);
    }

    .progress__fill{
      width:16%;
      height:100%;
      background:linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .section{
      padding:12px 0 34px;
    }

    .section__head{
      margin-bottom:16px;
    }

    .section__head h2{
      margin:0 0 8px;
      font-size:clamp(22px,2.4vw,30px);
      letter-spacing:-0.4px;
    }

    .section__head p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      max-width:72ch;
    }

    .modules{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .module-card{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:16px;
      position:relative;
      overflow:hidden;
    }

    .module-card--active{
      border-color:rgba(96,214,255,.24);
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    .module-card--locked{
      opacity:.72;
    }

    .module-badge{
      display:inline-flex;
      align-items:center;
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.74);
      font-size:12px;
      font-weight:800;
      margin-bottom:12px;
    }

    .module-card h3{
      margin:0 0 6px;
      font-size:20px;
    }

    .module-card p{
      margin:0 0 14px;
      color:var(--muted);
      line-height:1.55;
      min-height:72px;
    }

    .module-meta{
      display:grid;
      gap:8px;
      margin-bottom:16px;
    }

    .module-meta span{
      color:rgba(255,255,255,.72);
      font-size:14px;
    }

    .module-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .module-lock{
      position:absolute;
      top:14px;
      right:14px;
      font-size:13px;
      color:rgba(255,255,255,.58);
    }

    .notice{
      margin-top:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:14px;
      color:var(--muted);
      line-height:1.6;
    }

    .notice strong{
      color:var(--text);
    }

    #user-email{
      margin-top:10px;
      color:rgba(255,255,255,.78);
      font-size:14px;
    }

      .hero__grid{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr}
