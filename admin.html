<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin | FTZ Campus</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#070a0f;color:white}
    .container{width:min(1100px,92%);margin:auto;padding:24px 0}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    h1{margin:0;font-size:32px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;font-weight:700;text-decoration:none;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,rgba(96,214,255,.28),rgba(90,107,255,.22));border-color:rgba(96,214,255,.25)}
    .btn-ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.35)}
    .btn-bad{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.35)}
    .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:16px}
    .status,.muted{color:rgba(255,255,255,.62);font-size:14px;line-height:1.45}
    .grid{display:grid;gap:12px;margin-top:16px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
    .card-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .card h3{margin:0 0 4px;font-size:20px}
    .tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:12px;font-weight:800}
    .tag-pendiente{color:#fde68a;border-color:rgba(253,230,138,.28)}
    .tag-aprobado{color:#86efac;border-color:rgba(134,239,172,.28)}
    .tag-corregir{color:#fca5a5;border-color:rgba(252,165,165,.28)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    textarea,select{width:100%;margin-top:10px;border:none;border-radius:12px;padding:12px;box-sizing:border-box;font-family:inherit}
    textarea{min-height:70px;resize:vertical}
  </style>
</head>

<body>
<div class="container">
  <div class="top">
    <div>
      <h1>Panel de entregas</h1>
      <div class="muted">Panel interno para corregir entregas y gestionar revisiones.</div>
    </div>
    <div>
      <a class="btn" href="campus.html">Volver al campus</a>
      <button class="btn btn-primary" onclick="cargarEntregas()">Actualizar</button>
    </div>
  </div>

  <div class="panel">
    <div id="status" class="status">Cargando entregas...</div>
    <div id="lista" class="grid"></div>
  </div>
</div>

<script>
const supabaseUrl = "https://yfdiejyrhaaziceyeiuc.supabase.co";
const supabaseKey = "sb_publishable_fRXqVXDILy3hgUFvp341pA_qqZdcQ_d";
let supabase = null;

const ADMIN_EMAIL = "fitnesstrainingzone16@gmail.com";
const QUERY_TIMEOUT_MS = 15000;
let adminValidado = null;

function statusEl(){
  return document.getElementById("status");
}

function listaEl(){
  return document.getElementById("lista");
}

function mostrarStatus(texto, tipo = "info"){
  const status = statusEl();
  if(!status) return;
  status.innerText = texto;
  status.style.color = tipo === "error" ? "#fca5a5" : "rgba(255,255,255,.62)";
}

function detalleError(error){
  if(!error) return "Error desconocido.";
  return error.message || error.error_description || JSON.stringify(error);
}

function mostrarError(mensaje, error){
  console.error("[admin.html]", mensaje, error);
  mostrarStatus(`${mensaje}\nDetalle: ${detalleError(error)}`, "error");
}

window.addEventListener("error", (event) => {
  mostrarError("Error JavaScript en el panel admin.", event.error || event.message);
});

window.addEventListener("unhandledrejection", (event) => {
  mostrarError("Error asincronico en el panel admin.", event.reason);
});

function conTimeout(promesa, contexto){
  let timeoutId;
  const timeout = new Promise((_, reject) => {
    timeoutId = setTimeout(() => {
      reject(new Error(`Timeout en ${contexto} despues de ${QUERY_TIMEOUT_MS / 1000}s`));
    }, QUERY_TIMEOUT_MS);
  });

  return Promise.race([promesa, timeout]).finally(() => clearTimeout(timeoutId));
}

function inicializarSupabase(){
  if(supabase) return supabase;
  if(!window.supabase || !window.supabase.createClient){
    throw new Error("No se cargo la libreria de Supabase JS.");
  }

  supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
    auth: {
      autoRefreshToken: true,
      persistSession: true
    }
  });
  return supabase;
}

async function protegerAdmin() {
  try {
    const cliente = inicializarSupabase();
    console.log("[admin.html] Validando sesion admin...");
    const { data, error } = await conTimeout(cliente.auth.getUser(), "Supabase Auth");

    if (error) throw error;

    if (!data || !data.user) {
      console.warn("[admin.html] No hay usuario autenticado. Redirigiendo a login.");
      mostrarStatus("Tenes que iniciar sesion para entrar al panel.", "error");
      setTimeout(() => { window.location.href = "login.html"; }, 900);
      return false;
    }

    const email = (data.user.email || "").toLowerCase();
    console.log("[admin.html] Usuario autenticado:", email);

    if (email !== ADMIN_EMAIL) {
      console.warn("[admin.html] Acceso denegado para:", email);
      mostrarStatus("No tenes permisos para entrar al panel.", "error");
      setTimeout(() => { window.location.href = "campus.html"; }, 900);
      return false;
    }

    adminValidado = data.user;
    console.log("[admin.html] Admin validado correctamente.");
    return true;
  } catch (error) {
    mostrarError("Error validando acceso admin.", error);
    return false;
  }
}

function estadoClase(estado){
  if(estado === "aprobado") return "tag tag-aprobado";
  if(estado === "corregir") return "tag tag-corregir";
  return "tag tag-pendiente";
}

function fechaLinda(fecha){
  return fecha ? new Date(fecha).toLocaleString("es-AR") : "";
}

function escapeHtml(valor){
  return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[caracter]);
}

async function cargarEntregas(){
  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  const lista = listaEl();
  mostrarStatus("Cargando entregas...");
  lista.innerHTML = "";

  try {
    console.log("[admin.html] Consultando public.entregas como admin:", adminValidado.email);
    const consulta = supabase
      .from("entregas")
      .select("id,user_email,nombre,curso,archivo_url,comentario,estado,created_at")
      .order("created_at", { ascending:false });

    const { data, error } = await conTimeout(consulta, "consulta public.entregas");
    if(error) throw error;

    const entregas = Array.isArray(data) ? data : [];
    console.log("[admin.html] Entregas recibidas:", entregas.length, entregas);
    renderizarEntregas(entregas);
  } catch(error) {
    mostrarError("Error cargando entregas desde Supabase.", error);
  }
}

function renderizarEntregas(entregas){
  const lista = listaEl();
  lista.innerHTML = "";

  if(entregas.length === 0){
    mostrarStatus("Todavia no hay trabajos enviados.");
    return;
  }

  mostrarStatus("Total de entregas: " + entregas.length);

  entregas.forEach(entrega => {
    const id = escapeHtml(entrega.id);
    const archivoUrl = escapeHtml(entrega.archivo_url || "#");
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${escapeHtml(entrega.nombre || "Alumno sin nombre")}</h3>
          <div class="muted">${escapeHtml(entrega.user_email || "Sin email")}</div>
          <div class="muted">Curso: <strong>${escapeHtml(entrega.curso || "Sin curso")}</strong></div>
          <div class="muted">Detalle: <strong>${escapeHtml(entrega.comentario || "Entrega general")}</strong></div>
          <div class="muted">Fecha: ${fechaLinda(entrega.created_at)}</div>
        </div>
        <span class="${estadoClase(entrega.estado)}">${escapeHtml(entrega.estado || "pendiente")}</span>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="${archivoUrl}" target="_blank" rel="noopener">Abrir archivo</a>
        <button class="btn btn-ok" onclick="actualizarEstado('${id}', 'aprobado')">Aprobar entrega</button>
        <button class="btn btn-bad" onclick="actualizarEstado('${id}', 'corregir')">Pedir correccion</button>
        <button class="btn" onclick="actualizarEstado('${id}', 'pendiente')">Pendiente</button>
      </div>

      <textarea id="comentario-${id}" placeholder="Comentario para el alumno...">${escapeHtml(entrega.comentario || "")}</textarea>

      <div class="actions">
        <button class="btn" onclick="guardarComentario('${id}')">Guardar comentario</button>
      </div>
    `;

    lista.appendChild(card);
  });
}

async function actualizarEstado(id, estado){
  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  try {
    console.log("[admin.html] Actualizando estado:", { id, estado });
    const { error } = await conTimeout(
      supabase
        .from("entregas")
        .update({ estado })
        .eq("id", id),
      "actualizacion de estado"
    );

    if(error) throw error;
    await cargarEntregas();
  } catch(error){
    mostrarError("Error actualizando estado.", error);
    alert("Error actualizando estado: " + detalleError(error));
  }
}

async function guardarComentario(id){
  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  const comentario = document.getElementById("comentario-" + id).value;

  try {
    console.log("[admin.html] Guardando comentario:", { id });
    const { error } = await conTimeout(
      supabase
        .from("entregas")
        .update({ comentario })
        .eq("id", id),
      "guardado de comentario"
    );

    if(error) throw error;
    alert("Comentario guardado");
    await cargarEntregas();
  } catch(error){
    mostrarError("Error guardando comentario.", error);
    alert("Error guardando comentario: " + detalleError(error));
  }
}

async function iniciarAdmin(){
  const ok = await protegerAdmin();
  if(ok) await cargarEntregas();
}

iniciarAdmin();
</script>
</body>
</html>
