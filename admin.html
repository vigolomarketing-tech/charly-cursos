<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Panel Admin | FTZ Campus</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#070a0f;color:white}
    .container{width:min(1100px,92%);margin:auto;padding:24px 0}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap}
    h1{margin:0;font-size:clamp(26px,5vw,32px)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2}
    .btn-primary{background:linear-gradient(135deg,rgba(96,214,255,.28),rgba(90,107,255,.22));border-color:rgba(96,214,255,.25)}
    .btn-ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.35)}
    .btn-bad{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.35)}
    .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:16px}
    .status,.muted{color:rgba(255,255,255,.62);font-size:14px;line-height:1.45}
    .status{min-height:20px}
    .status-ok{color:#86efac}
    .status-error{color:#fca5a5}
    .grid{display:grid;gap:14px;margin-top:16px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .card h3{margin:0 0 6px;font-size:20px}
    .meta{display:grid;gap:4px}
    .details{margin-top:8px;color:rgba(255,255,255,.55);font-size:13px}
    .details summary{cursor:pointer;font-weight:700}
    .details code{display:block;margin-top:6px;max-width:100%;overflow-wrap:anywhere;color:rgba(255,255,255,.72)}
    .tag{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:12px;font-weight:800;text-transform:uppercase}
    .tag-pendiente{color:#fde68a;border-color:rgba(253,230,138,.35);background:rgba(253,230,138,.10)}
    .tag-aprobado{color:#86efac;border-color:rgba(134,239,172,.35);background:rgba(134,239,172,.10)}
    .tag-correccion{color:#fca5a5;border-color:rgba(252,165,165,.35);background:rgba(252,165,165,.10)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    textarea{width:100%;margin-top:12px;border:none;border-radius:12px;padding:12px;box-sizing:border-box;font-family:inherit;min-height:82px;resize:vertical}
    .card-message{margin-top:10px;color:#86efac;font-size:14px;min-height:18px}

    @media (max-width: 640px){
      .container{width:min(94%,1100px);padding:18px 0 32px}
      .top,.top-actions,.actions{display:grid;grid-template-columns:1fr;width:100%}
      .btn{width:100%;min-height:42px;white-space:normal;text-align:center}
      .panel{padding:14px;border-radius:16px}
      .card{padding:14px;border-radius:16px}
      .card-top{display:grid;grid-template-columns:1fr;gap:10px}
      .tag{width:max-content;max-width:100%}
      .btn-file{min-height:36px;padding:8px 12px}
    }
  </style>
</head>

<body>
<div class="container">
  <div class="top">
    <div>
      <h1>Panel de entregas</h1>
      <div class="muted">Panel interno para corregir entregas y gestionar revisiones.</div>
    </div>
    <div class="top-actions">
      <a class="btn" href="campus.html">Volver al campus</a>
      <button class="btn btn-primary" onclick="cargarEntregas()">Actualizar</button>
    </div>
  </div>

  <div class="panel">
    <div id="status" class="status">Cargando entregas...</div>
    <div id="lista" class="grid"></div>
  </div>
</div>

<script>
const supabaseUrl = "https://yfdiejyrhaaziceyeiuc.supabase.co";
const supabaseKey = "sb_publishable_fRXqVXDILy3hgUFvp341pA_qqZdcQ_d";
const ADMIN_EMAIL = "fitnesstrainingzone16@gmail.com";
const QUERY_TIMEOUT_MS = 15000;

let supabaseClient = null;
let adminValidado = null;

function obtenerElemento(id){
  const elemento = document.getElementById(id);
  if(!elemento){
    throw new Error("No existe el elemento HTML #" + id + " requerido por admin.html.");
  }
  return elemento;
}

function statusEl(){
  return obtenerElemento("status");
}

function listaEl(){
  return obtenerElemento("lista");
}

function mostrarStatus(texto, tipo = "info"){
  const status = statusEl();
  status.className = "status" + (tipo === "ok" ? " status-ok" : tipo === "error" ? " status-error" : "");
  status.innerText = texto;
}

function detalleError(error){
  if(!error) return "Error desconocido.";
  return error.message || error.error_description || JSON.stringify(error);
}

function mostrarError(mensaje, error){
  console.error("[admin.html]", mensaje, error);
  mostrarStatus(`${mensaje}: ${detalleError(error)}`, "error");
}

window.addEventListener("error", (event) => {
  mostrarError("Error JavaScript en el panel admin", event.error || event.message);
});

window.addEventListener("unhandledrejection", (event) => {
  mostrarError("Error asincronico en el panel admin", event.reason);
});

function conTimeout(promesa, contexto, ms = QUERY_TIMEOUT_MS){
  let timeoutId;
  const timeout = new Promise((_, reject) => {
    timeoutId = setTimeout(() => {
      reject(new Error(`Timeout en ${contexto} despues de ${ms / 1000}s`));
    }, ms);
  });

  return Promise.race([promesa, timeout]).finally(() => clearTimeout(timeoutId));
}

function inicializarSupabase(){
  if(supabaseClient) return supabaseClient;
  if(!window.supabase || !window.supabase.createClient){
    throw new Error("No se cargo la libreria de Supabase JS.");
  }

  supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
    auth: {
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  return supabaseClient;
}

async function obtenerSesion(cliente){
  const { data, error } = await conTimeout(cliente.auth.getSession(), "getSession");
  if(error) throw error;

  if(!data || !data.session || !data.session.user){
    throw new Error("No hay sesion activa. Volve a iniciar sesion desde login.html.");
  }

  return data.session;
}

async function protegerAdmin() {
  try {
    const cliente = inicializarSupabase();
    const session = await obtenerSesion(cliente);
    const email = (session.user.email || "").toLowerCase();

    if (email !== ADMIN_EMAIL) {
      console.warn("[admin.html] Acceso denegado para:", email);
      mostrarStatus("No tenes permisos para entrar al panel.", "error");
      setTimeout(() => { window.location.href = "campus.html"; }, 900);
      return false;
    }

    adminValidado = session.user;
    return true;
  } catch (error) {
    mostrarError("Error validando acceso admin", error);
    if(detalleError(error).includes("No hay sesion activa")){
      setTimeout(() => { window.location.href = "login.html"; }, 1400);
    }
    return false;
  }
}

function estadoClase(estado){
  if(estado === "aprobado") return "tag tag-aprobado";
  if(estado === "correccion" || estado === "corregir") return "tag tag-correccion";
  return "tag tag-pendiente";
}

function etiquetaEstado(estado){
  if(estado === "corregir") return "correccion";
  return estado || "pendiente";
}

function fechaLinda(fecha){
  return fecha ? new Date(fecha).toLocaleString("es-AR") : "";
}

function escapeHtml(valor){
  const texto = valor == null ? "" : valor;
  return String(texto).replace(/[&<>"']/g, caracter => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[caracter]);
}

async function cargarEntregas(){
  mostrarStatus("Cargando entregas...");

  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  listaEl().innerHTML = "";

  try {
    const consulta = supabaseClient
      .from("entregas")
      .select("id,user_email,nombre,curso,archivo_url,comentario,estado,created_at")
      .order("created_at", { ascending:false });

    const { data, error } = await conTimeout(consulta, "consulta public.entregas");
    if(error) throw error;

    renderizarEntregas(Array.isArray(data) ? data : []);
  } catch(error) {
    mostrarError("Error cargando entregas desde Supabase", error);
  }
}

function renderizarEntregas(entregas){
  const lista = listaEl();
  lista.innerHTML = "";

  if(entregas.length === 0){
    mostrarStatus("Todavia no hay trabajos enviados.");
    return;
  }

  mostrarStatus("Total de entregas: " + entregas.length, "ok");

  entregas.forEach(entrega => {
    const idOriginal = entrega.id;
    const id = escapeHtml(idOriginal);
    const estado = etiquetaEstado(entrega.estado);
    const archivoUrl = escapeHtml(entrega.archivo_url || "#");
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = idOriginal;

    card.innerHTML = `
      <div class="card-top">
        <div class="meta">
          <h3>${escapeHtml(entrega.nombre || "Alumno sin nombre")}</h3>
          <div class="muted">Email: <strong>${escapeHtml(entrega.user_email || "Sin email")}</strong></div>
          <div class="muted">Curso: <strong>${escapeHtml(entrega.curso || "Sin curso")}</strong></div>
          <div class="muted">Fecha: ${fechaLinda(entrega.created_at)}</div>
          <details class="details">
            <summary>Ver detalles</summary>
            <code>ID: ${id}</code>
          </details>
        </div>
        <span data-role="estado" class="${estadoClase(estado)}">${escapeHtml(estado)}</span>
      </div>

      <div class="actions">
        <a class="btn btn-primary btn-file" href="${archivoUrl}" target="_blank" rel="noopener">Abrir archivo</a>
        <button class="btn btn-ok" onclick="actualizarEstado('${id}', 'aprobado')">Aprobar entrega</button>
        <button class="btn btn-bad" onclick="actualizarEstado('${id}', 'corregir')">Pedir correccion</button>
        <button class="btn" onclick="actualizarEstado('${id}', 'pendiente')">Pendiente</button>
      </div>

      <textarea id="comentario-${id}" placeholder="Escribí observaciones para el alumno...">${escapeHtml(entrega.comentario || "")}</textarea>

      <div class="actions">
        <button class="btn" onclick="guardarComentario('${id}')">Guardar comentario</button>
      </div>
      <div class="card-message" data-role="mensaje"></div>
    `;

    lista.appendChild(card);
  });
}

async function actualizarEstado(id, estado){
  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  try {
    const { error } = await conTimeout(
      supabaseClient
        .from("entregas")
        .update({ estado })
        .eq("id", id),
      "actualizacion de estado"
    );

    if(error) throw error;
    actualizarTarjeta(id, { estado, mensaje: "Estado actualizado" });
  } catch(error){
    mostrarError("Error actualizando estado", error);
    alert("Error actualizando estado: " + detalleError(error));
  }
}

async function guardarComentario(id){
  if(!adminValidado){
    const autorizado = await protegerAdmin();
    if(!autorizado) return;
  }

  const comentario = document.getElementById("comentario-" + id).value;

  try {
    const { error } = await conTimeout(
      supabaseClient
        .from("entregas")
        .update({ comentario })
        .eq("id", id),
      "guardado de comentario"
    );

    if(error) throw error;
    actualizarTarjeta(id, { mensaje: "Comentario guardado" });
  } catch(error){
    mostrarError("Error guardando comentario", error);
    alert("Error guardando comentario: " + detalleError(error));
  }
}

function actualizarTarjeta(id, cambios){
  const card = Array.from(document.querySelectorAll(".card"))
    .find(item => item.dataset.id === String(id));
  if(!card) return;

  if(cambios.estado){
    const estado = etiquetaEstado(cambios.estado);
    const tag = card.querySelector('[data-role="estado"]');
    if(tag){
      tag.className = estadoClase(estado);
      tag.innerText = estado;
    }
  }

  if(cambios.mensaje){
    const mensaje = card.querySelector('[data-role="mensaje"]');
    if(mensaje){
      mensaje.innerText = cambios.mensaje;
      setTimeout(() => {
        if(mensaje.innerText === cambios.mensaje) mensaje.innerText = "";
      }, 3000);
    }
  }
}

async function iniciarAdmin(){
  mostrarStatus("Cargando entregas...");
  const ok = await protegerAdmin();
  if(ok) await cargarEntregas();
}

iniciarAdmin();
</script>
</body>
</html>
