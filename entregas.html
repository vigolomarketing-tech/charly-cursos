<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregas | FTZ Campus</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#070a0f;
      --panel:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.64);
      --accent:#60d6ff;
      --accent2:#5a6bff;
      --shadow:0 16px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 0%, rgba(96,214,255,.14), transparent 55%),
        radial-gradient(900px 600px at 85% 10%, rgba(90,107,255,.14), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    a{color:inherit;text-decoration:none}

    .container{
      width:min(700px,92%);
      margin:0 auto;
      padding:32px 0 48px;
    }

    .top{
      display:flex;
      gap:10px;
      margin-bottom:28px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-weight:700;
      cursor:pointer;
      font-size:14px;
      width:100%;
    }

    .btn--primary{
      border-color:rgba(96,214,255,.25);
      background:linear-gradient(135deg,rgba(96,214,255,.22),rgba(90,107,255,.18));
    }

    .btn--ghost{
      background:transparent;
      width:auto;
    }

    h1{
      margin:0 0 6px;
      font-size:clamp(24px,4vw,34px);
      letter-spacing:-.5px;
    }

    .subtitle{
      margin:0 0 24px;
      color:var(--muted);
      line-height:1.6;
    }

    /* Info box de qué se está entregando */
    .info-entrega{
      background:rgba(96,214,255,.07);
      border:1px solid rgba(96,214,255,.18);
      border-radius:16px;
      padding:14px 16px;
      margin-bottom:20px;
    }

    .info-entrega strong{
      display:block;
      color:var(--accent);
      font-size:13px;
      letter-spacing:.5px;
      margin-bottom:4px;
    }

    .info-entrega span{
      font-size:16px;
      font-weight:700;
    }

    /* Card del formulario */
    .card{
      background:var(--panel);
      border:1px solid var(--stroke);
      border-radius:20px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .field{
      margin-bottom:14px;
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:6px;
      letter-spacing:.3px;
    }

    .field input,
    .field select{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:15px;
      font-family:inherit;
      outline:none;
    }

    .field input:focus,
    .field select:focus{
      border-color:rgba(96,214,255,.30);
    }

    .field select option{
      background:#1a1f2e;
      color:white;
    }

    .field input[type="file"]{
      padding:10px 14px;
      cursor:pointer;
    }

    .field input[type="file"]::file-selector-button{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:8px;
      color:white;
      padding:6px 12px;
      cursor:pointer;
      font-weight:700;
      font-size:13px;
      margin-right:10px;
    }

    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      font-weight:700;
      display:none;
    }

    .status--ok{
      background:rgba(134,239,172,.10);
      border:1px solid rgba(134,239,172,.25);
      color:#86efac;
    }

    .status--error{
      background:rgba(252,165,165,.10);
      border:1px solid rgba(252,165,165,.25);
      color:#fca5a5;
    }

    .status--loading{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="top">
      <a class="btn btn--ghost" href="modulo.html">← Volver al módulo</a>
    </div>

    <h1>📤 Entregar actividad</h1>
    <p class="subtitle">Subí tu archivo y lo revisamos a la brevedad.</p>

    <!-- Qué se está entregando — se llena automáticamente desde la URL -->
    <div class="info-entrega" id="info-entrega">
      <strong>ENTREGANDO</strong>
      <span id="label-entrega">Cargando...</span>
    </div>

    <div class="card">

      <div class="field">
        <label>Tu nombre</label>
        <input type="text" id="nombre" placeholder="Nombre completo">
      </div>

      <div class="field">
        <label>Curso</label>
        <select id="curso">
          <option value="">Seleccioná el curso</option>
          <option value="Personal Trainer">Personal Trainer</option>
          <option value="Musculación">Musculación</option>
          <option value="Funcional & HIIT">Funcional & HIIT</option>
          <option value="Nutrición">Nutrición</option>
        </select>
      </div>

      <div class="field">
        <label>Archivo (PDF, imagen, doc)</label>
        <input type="file" id="archivo" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
      </div>

      <button class="btn btn--primary" onclick="subir()">Enviar entrega</button>

      <div class="status" id="status"></div>

    </div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yfdiejyrhaaziceyeiuc.supabase.co",
      "sb_publishable_fRXqVXDILy3hgUFvp341pA_qqZdcQ_d"
    );

    // ✅ Leer parámetros de la URL y pre-cargar el formulario
    const params        = new URLSearchParams(window.location.search);
    const tipo          = params.get("tipo")   || "general";
    const nombreEntrega = params.get("nombre") || "Entrega general";
    const cursoPre      = params.get("curso")  || "";

    // Mostrar qué se está entregando
    document.getElementById("label-entrega").innerText = nombreEntrega;

    // Pre-seleccionar el curso si viene en la URL
    const selectCurso = document.getElementById("curso");
    if (cursoPre) {
      for (const option of selectCurso.options) {
        if (option.value.toLowerCase().includes(cursoPre.toLowerCase())) {
          option.selected = true;
          break;
        }
      }
    }

    // Mostrar estado
    function mostrarStatus(texto, tipo) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.className = "status status--" + tipo;
      el.innerText = texto;
    }

    async function subir() {
      const nombre  = document.getElementById("nombre").value.trim();
      const curso   = document.getElementById("curso").value;
      const archivo = document.getElementById("archivo").files[0];

      if (!nombre) { mostrarStatus("⚠️ Completá tu nombre.", "error"); return; }
      if (!curso)  { mostrarStatus("⚠️ Seleccioná el curso.", "error"); return; }
      if (!archivo){ mostrarStatus("⚠️ Seleccioná un archivo.", "error"); return; }

      mostrarStatus("Subiendo archivo...", "loading");

      // Verificar sesión
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData.user) {
        mostrarStatus("❌ Tenés que iniciar sesión para entregar.", "error");
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
        return;
      }

      // Subir archivo al storage
      const nombreSeguro = archivo.name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]/g, "_");
      const fileName = userData.user.id + "/" + Date.now() + "-" + nombreSeguro;

      const { error: uploadError } = await supabaseClient.storage
        .from("entregas")
        .upload(fileName, archivo);

      if (uploadError) {
        mostrarStatus("❌ Error al subir el archivo: " + uploadError.message, "error");
        return;
      }

      // Obtener URL pública
      const { data: urlData } = supabaseClient.storage
        .from("entregas")
        .getPublicUrl(fileName);

      const detalleEntrega = tipo.replaceAll("-", " ") + " - " + nombreEntrega.replaceAll("-", " ");

      // Guardar en base de datos
      const { error: dbError } = await supabaseClient
        .from("entregas")
        .insert([{
          user_email:     userData.user.email,
          nombre:         nombre,
          curso:          curso,
          archivo_url:    urlData.publicUrl,
          comentario:     detalleEntrega,
          estado:         "pendiente"
        }]);

      if (dbError) {
        mostrarStatus("❌ Error al registrar la entrega: " + dbError.message, "error");
        return;
      }

      mostrarStatus("✅ ¡Entrega enviada! El equipo académico la va a revisar pronto.", "ok");

      // Limpiar formulario
      document.getElementById("nombre").value = "";
      document.getElementById("archivo").value = "";
    }
  </script>
</body>
</html>
