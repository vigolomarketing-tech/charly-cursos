<script>
const supabaseUrl = "https://yfdiejyrhaaziceyeiuc.supabase.co";

);

const params = new URLSearchParams(window.location.search);
const tipoEntrega = params.get("tipo") || "general";
const nombreEntrega = params.get("nombre") || "Entrega general";

function formatearTexto(texto){
  return texto
    .replaceAll("-", " ")
    .replaceAll("_", " ")
    .replace(/\b\w/g, letra => letra.toUpperCase());
}
const tipo = params.get("tipo") || "general";
const nombreEntrega = params.get("nombre") || "general";

function mostrarInfoEntrega(){
  const info = document.getElementById("infoEntrega");
document.getElementById("infoEntrega").innerText =
"Estás entregando: " + tipo + " - " + nombreEntrega;

  if(tipoEntrega === "general"){
    info.innerText = "Estás realizando una entrega general del campus.";
    return;
  }
async function subir(){

  info.innerText = "Estás entregando: " + formatearTexto(tipoEntrega) + " — " + formatearTexto(nombreEntrega);
}
const nombre = document.getElementById("nombre").value;
const curso = document.getElementById("curso").value;
const archivo = document.getElementById("archivo").files[0];
const status = document.getElementById("status");

async function verificarSesion(){
  const { data } = await supabase.auth.getUser();
  const box = document.getElementById("userBox");
if(!nombre || !curso || !archivo){
status.innerText = "⚠️ Completá todo";
return;
}

  if(!data.user){
    box.innerText = "❌ No estás logueado";
    return;
  }
const { data } = await supabase.auth.getUser();

  box.innerText = "✅ Sesión iniciada: " + data.user.email;
if(!data.user){
status.innerText = "❌ Iniciá sesión";
return;
}

async function subirTrabajo(){
  const nombre = document.getElementById("nombre").value.trim();
  const curso = document.getElementById("curso").value;
  const archivo = document.getElementById("archivo").files[0];
  const status = document.getElementById("status");

  if(!nombre || !curso || !archivo){
    status.innerText = "⚠️ Completá todos los campos";
    return;
  }

  const { data } = await supabase.auth.getUser();

  if(!data.user){
    status.innerText = "❌ Tenés que iniciar sesión";
    return;
  }

  const email = data.user.email;

  status.innerText = "Subiendo archivo...";

  const nombreSeguro = archivo.name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9._-]/g, "_");

  const fileName = Date.now() + "-" + nombreSeguro;

  const { error: uploadError } = await supabase.storage
    .from("entregas")
    .upload(fileName, archivo);

  if(uploadError){
    status.innerText = "❌ Error subiendo archivo";
    console.log(uploadError);
    return;
  }

  const { data: urlData } = supabase.storage
    .from("entregas")
    .getPublicUrl(fileName);

  const archivo_url = urlData.publicUrl;

  const detalleEntrega = tipoEntrega + " - " + nombreEntrega;

  const { error: dbError } = await supabase
    .from("entregas")
    .insert([
      {
        user_email: email,
        nombre: nombre,
        curso: curso,
        archivo_url: archivo_url,
        comentario: detalleEntrega,
        estado: "pendiente"
      }
    ]);

  if(dbError){
    status.innerText = "❌ Error guardando en base de datos";
    console.log(dbError);
    return;
  }

  status.innerText = "✅ Entrega enviada correctamente";

  document.getElementById("nombre").value = "";
  document.getElementById("curso").value = "";
  document.getElementById("archivo").value = "";
}
const fileName = Date.now() + "-" + archivo.name;

await supabase.storage

.upload(fileName, archivo);

mostrarInfoEntrega();
verificarSesion();
const { data: urlData } = supabase.storage

await supabase.from("entregas").insert([{

nombre: nombre,

archivo_url: urlData.publicUrl,
tipo: tipo,
nombre_entrega: nombreEntrega,
estado: "pendiente"
}]);

status.innerText = "✅ Entregado";
}
